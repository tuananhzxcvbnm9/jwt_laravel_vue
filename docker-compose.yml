version: '3.9'
services:
  backend:
    image: php:8.3-cli
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: sh -c "php -S 0.0.0.0:8000 -t public"
    ports:
      - '8000:8000'
    depends_on:
      - mysql
    networks:
      - appnet

  frontend:
    image: node:22-alpine
    working_dir: /usr/src/app
    volumes:
      - ./frontend:/usr/src/app
    command: sh -c "npm install && npm run dev"
    ports:
      - '5173:5173'
    networks:
      - appnet

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet:
    driver: bridge
